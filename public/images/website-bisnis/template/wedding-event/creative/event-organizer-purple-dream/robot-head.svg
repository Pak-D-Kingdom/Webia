<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 170 186" width="170" height="186" ><defs><linearGradient id="hd" x1="0.15" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#f1ecff"/><stop offset="1" stop-color="#cfc2ff"/></linearGradient><linearGradient id="vz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d1763"/><stop offset="1" stop-color="#0e0626"/></linearGradient><linearGradient id="bd" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#a469ff"/><stop offset="1" stop-color="#4318a0"/></linearGradient><linearGradient id="ear" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9a6ff"/><stop offset="1" stop-color="#6d28d9"/></linearGradient><linearGradient id="hatg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9b8ff"/><stop offset="0.55" stop-color="#9b5cff"/><stop offset="1" stop-color="#6a2fd4"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b8"/><stop offset="0.5" stop-color="#f4c24f"/><stop offset="1" stop-color="#c58a22"/></linearGradient><linearGradient id="pk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd3f3"/><stop offset="1" stop-color="#ff6fd0"/></linearGradient><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ff0ff"/><stop offset="0.5" stop-color="#ff8fd8"/><stop offset="1" stop-color="#ff8fd8" stop-opacity="0"/></linearGradient><radialGradient id="ey" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#8ff4ff"/><stop offset="1" stop-color="#19b9ff"/></radialGradient><radialGradient id="eyg" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8ff4ff" stop-opacity="0.9"/><stop offset="1" stop-color="#19b9ff" stop-opacity="0"/></radialGradient><radialGradient id="hl" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#c9a6ff" stop-opacity="0.75"/><stop offset="1" stop-color="#c9a6ff" stop-opacity="0"/></radialGradient><radialGradient id="pg" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd3f3"/><stop offset="1" stop-color="#ff6fd0"/></radialGradient><filter id="g4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter><filter id="g2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter></defs>
<style>
.bot2{animation:bob 4.2s ease-in-out infinite}.botx{animation:bob 4.2s ease-in-out infinite}
.shadow{transform-box:fill-box;transform-origin:center;animation:shadow 4.2s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.hat{transform-origin:122px 72px;animation:hat 3.6s ease-in-out infinite}
.pom{transform-box:fill-box;transform-origin:center;animation:pom 1.8s ease-in-out infinite}
.arm-l{transform-origin:100px 202px;animation:wave 2.8s ease-in-out infinite}
.arm-r{transform-origin:160px 202px;animation:hold 4.2s ease-in-out infinite}
.wand{transform-origin:196px 182px;animation:wand 3.2s ease-in-out infinite}
.wstar{transform-box:fill-box;transform-origin:center;animation:tw 2s ease-in-out infinite}
.sp1,.sp2,.sp3{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
.sp2{animation-delay:.8s}.sp3{animation-delay:1.5s}
.flame{transform-box:fill-box;transform-origin:50% 0;animation:flame .5s ease-in-out infinite alternate}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out infinite}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 4.2s ease-in-out infinite}
.badge{transform-box:fill-box;transform-origin:center;animation:badge 1.8s ease-in-out infinite}
.c1,.c2,.c3,.c4{transform-box:fill-box;transform-origin:center;animation:conf 5s ease-in-out infinite}
.c2{animation-delay:-1.2s}.c3{animation-delay:-2.4s}.c4{animation-delay:-3.4s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.28}50%{transform:scale(.8);opacity:.16}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes hat{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(-7deg)}}
@keyframes pom{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.12)}}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-16deg)}50%{transform:rotate(6deg)}75%{transform:rotate(-12deg)}}
@keyframes hold{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
@keyframes wand{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
@keyframes tw{0%,100%{opacity:.45;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
@keyframes flame{from{transform:scale(.8,.7);opacity:.75}to{transform:scale(1.1,1.2);opacity:1}}
@keyframes ring{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.35);opacity:0}}
@keyframes halo{0%,100%{transform:scale(.96);opacity:.5}50%{transform:scale(1.06);opacity:.8}}
@keyframes badge{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes conf{0%,100%{transform:translateY(0) rotate(0);opacity:.9}50%{transform:translateY(-12px) rotate(90deg);opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

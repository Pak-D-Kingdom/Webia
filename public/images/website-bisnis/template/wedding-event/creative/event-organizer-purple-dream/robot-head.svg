ap="round" opacity=".85"/><circle cx="118" cy="40" r="3" fill="url(#gold)"/><circle cx="138" cy="54" r="3" fill="url(#gold)"/><circle cx="110" cy="58" r="2.4" fill="#fff"/><ellipse cx="122" cy="73" rx="33" ry="7.5" fill="url(#gold)" stroke="#fff3b8" stroke-width="1.5"/><g class="pom"><circle cx="126" cy="13" r="9" fill="url(#pg)"/><circle cx="123" cy="10" r="3" fill="#fff" opacity=".8"/></g></g></g></g></g></svg>
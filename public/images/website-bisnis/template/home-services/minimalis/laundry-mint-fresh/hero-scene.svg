  <g transform="translate(626 292)">
    <rect x="30" y="-6" width="46" height="26" rx="6" fill="#6DB894"/><rect x="40" y="-22" width="26" height="18" rx="5" fill="#3F8A6A"/>
    <path d="M14 36c0-10 10-18 22-18h34c12 0 22 8 22 18v132a20 20 0 0 1-20 20H34a20 20 0 0 1-20-20z" fill="url(#bot)" stroke="#BCD9CA" stroke-width="3"/>
    <path d="M92 40c18 6 22 22 20 40" fill="none" stroke="#BCD9CA" stroke-width="3"/>
    <rect x="14" y="88" width="94" height="68" fill="#fff" opacity=".92"/>
    <path d="M61 98c-14 6-20 18-16 34 16-4 22-16 16-34z" fill="#6DB894"/><path d="M60 100c-2 12-6 22-12 32" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="61" y="148" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="700" fill="#2F7358">FreshWash</text>
  </g>


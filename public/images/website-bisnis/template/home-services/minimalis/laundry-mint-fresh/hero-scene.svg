    <path d="M130 392v108M326 392v108" stroke="#B98F5E" stroke-opacity=".5" stroke-width="3"/>
    <!-- tumpukan handuk -->
    <rect x="142" y="362" width="172" height="32" rx="8" fill="#BFD7E8"/><path d="M142 378h172" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
    <rect x="148" y="332" width="162" height="32" rx="8" fill="#FFFFFF" stroke="#E3EEE6" stroke-width="2"/>
    <rect x="140" y="302" width="176" height="32" rx="8" fill="#CBE8D8"/><path d="M140 318h176" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
    <rect x="152" y="274" width="156" height="30" rx="8" fill="#F4F1EA" stroke="#E6E0D2" stroke-width="2"/>
    <rect x="146" y="246" width="166" height="30" rx="8" fill="#D6E6F2"/><path d="M146 261h166" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>

    <rect x="372" y="132" width="250" height="62" rx="26" fill="#fff"/>
    <path d="M372 194h250" stroke="#E3EBE7" stroke-width="3"/>
    <rect x="404" y="150" width="96" height="28" rx="8" fill="#2A3B38"/>
    <text x="452" y="170" text-anchor="middle" font-family="monospace" font-size="15" fill="#7DF0BE">00:45</text>

    <path d="M44 146l-4-14M80 146l4-14" stroke="#7FBF9E" stroke-width="6" stroke-linecap="round"/>
    <rect x="46" y="168" width="32" height="24" rx="6" fill="#6DB894"/><path d="M62 172c-6 4-8 10-6 16 7-2 10-8 6-16z" fill="#E6F4EC"/>
    <!-- kepala -->
    <ellipse cx="62" cy="86" rx="40" ry="36" fill="#fff" stroke="#E6EEE9" stroke-width="2"/>
    <circle cx="48" cy="82" r="5.500" fill="#2B3A35"/><circle cx="76" cy="82" r="5.500" fill="#2B3A35"/>
    <circle cx="50" cy="80" r="1.800" fill="#fff"/><circle cx="78" cy="80" r="1.800" fill="#fff"/>
    <path d="M58 94c2 3 6 3 8 0" stroke="#2B3A35" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="62" cy="92" rx="3" ry="2" fill="#F5A3B6"/>
    <circle cx="38" cy="95" r="5" fill="#FBD3DC" opacity=".8"/><circle cx="86" cy="95" r="5" fill="#FBD3DC" opacity=".8"/>
    <!-- tangan memegang handuk -->
    <path d="M30 150c-14 6-20 22-14 36" stroke="#fff" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M30 150c-14 6-20 22-14 36" stroke="#E6EEE9" stroke-width="2" stroke-linecap="round" fill="none" opacity=".0"/>
    <rect x="84" y="140" width="48" height="58" rx="8" fill="#fff" stroke="#E3EEE6" stroke-width="2" transform="rotate(8 108 170)"/>
    <path d="M92 156h34M92 166h34M92 176h30" stroke="#E3EEE6" stroke-width="2" transform="rotate(8 108 170)"/>
    <path d="M94 156c10 0 14 10 12 28" stroke="#fff" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="26" cy="196" r="8" fill="#fff" stroke="#E6EEE9" stroke-width="2"/>
  </g>

  <!-- sparkle -->
  <g fill="#fff" stroke="#BFE0CE" stroke-width="1.500"><circle cx="330" cy="120" r="7"/><circle cx="348" cy="146" r="4"/><circle cx="700" cy="196" r="5"/></g>
  </g>
</svg>

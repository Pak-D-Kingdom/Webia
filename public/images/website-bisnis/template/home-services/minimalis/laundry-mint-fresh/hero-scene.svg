    <path d="M40 44C32 14 36-2 44 0c8 2 8 24 8 44z" fill="#FBD3DC"/>
    <path d="M70 54C70 14 82-8 96-6c12 2 8 40-6 62z" fill="#fff" stroke="#E6EEE9" stroke-width="2" transform="rotate(8 82 30)"/>
    <path d="M76 46C76 18 84 2 92 4c8 2 4 26-4 46z" fill="#FBD3DC" transform="rotate(8 82 30)"/>

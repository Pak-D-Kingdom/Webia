    <path d="M44 56c4-22 28-34 64-30 26 3 40 14 46 34z" fill="#CBE8D8"/>
    <path d="M100 60c10-22 40-30 70-18 20 8 30 20 32 36z" fill="#F4F1EA" stroke="#E6E0D2" stroke-width="2"/>
    <path d="M30 44h86M40 50h74" stroke="#E3EEE6" stroke-width="2"/>
    <path d="M150 46c20-6 34 4 40 18" stroke="#fff" stroke-opacity=".8" stroke-width="3" fill="none"/>
  </g>


      <path d="M0 0C26-8 48-34 44-62 16-54-4-30 0 0z"/>
      <path d="M0 0C-8-30-4-62 8-84 22-62 12-26 0 0z"/>
      <path d="M0 0C-34 8-60 4-72-22-44-30-14-20 0 0z"/>
    </g>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- dinding & cahaya -->
  <rect width="1600" height="520" fill="url(#wall)"/>
  <rect x="640" width="960" height="520" fill="url(#sun)"/>
  <g fill="#fff" stroke="#BFE0CE" stroke-width="1.5" opacity=".8"><circle cx="560" cy="150" r="9"/><circle cx="590" cy="190" r="5"/><circle cx="520" cy="110" r="4"/></g>
  <g transform="translate(640 0)">
  <!-- jendela -->
  <g opacity=".95">
    <rect x="360" y="30" width="360" height="250" rx="6" fill="#FFFFFF" opacity=".75"/>
    <path d="M540 30v250M360 155h360" stroke="#E3EEE6" stroke-width="6"/>
    <rect x="360" y="30" width="360" height="250" rx="6" fill="none" stroke="#E3EEE6" stroke-width="8"/>
  </g>
  <!-- tirai kanan -->
  <path d="M800 0h160v520H800c18-120 20-300 0-520z" fill="url(#cur)"/>
  <g stroke="#CDB894" stroke-opacity=".55" stroke-width="3"><path d="M830 0v520M862 0v520M894 0v520M926 0v520"/></g>
  <path d="M800 0c20 160 18 330 0 520" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3"/>

  <!-- tanaman gantung kanan atas -->

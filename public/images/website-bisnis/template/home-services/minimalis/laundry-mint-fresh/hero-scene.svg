<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMaxYMid slice" role="img" aria-label="Mesin cuci, kelinci maskot, handuk bersih, dan keranjang laundry" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FBF8"/><stop offset=".55" stop-color="#EAF4EC"/><stop offset="1" stop-color="#DCEBE0"/></linearGradient>
    <radialGradient id="sun" cx=".62" cy=".28" r=".55"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="cur" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EFE3CF"/><stop offset=".5" stop-color="#E4D3B8"/><stop offset="1" stop-color="#D8C3A3"/></linearGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E9EEEC"/><stop offset=".25" stop-color="#FFFFFF"/><stop offset=".8" stop-color="#F5F8F6"/><stop offset="1" stop-color="#DCE4E0"/></linearGradient>
    <radialGradient id="glass" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#EAF6F8"/><stop offset=".6" stop-color="#B9D6DE"/><stop offset="1" stop-color="#8FB4C0"/></radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6C9A0"/><stop offset="1" stop-color="#C9A474"/></linearGradient>
    <linearGradient id="wk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9CFA8"/><stop offset="1" stop-color="#C79F6D"/></linearGradient>
    <linearGradient id="bot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C8E6D7"/><stop offset=".45" stop-color="#F6FCF9"/><stop offset="1" stop-color="#A9D6C0"/></linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F1E6D6"/><stop offset="1" stop-color="#D9C6AA"/></linearGradient>
    <g id="mon">

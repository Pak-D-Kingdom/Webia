    <circle cx="497" cy="337" r="92" fill="#C9D6D2" stroke="#B5C6C0" stroke-width="5"/>
    <circle cx="497" cy="337" r="80" fill="url(#glass)"/>
    <ellipse cx="470" cy="305" rx="30" ry="46" fill="#fff" opacity=".42" transform="rotate(30 470 305)"/>

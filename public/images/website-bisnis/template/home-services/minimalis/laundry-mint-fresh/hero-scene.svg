    <g clip-path="inset(0)"><circle cx="497" cy="360" r="42" fill="#F5FAF8" opacity=".75"/><circle cx="470" cy="372" r="26" fill="#CBE8D8" opacity=".85"/><circle cx="520" cy="376" r="22" fill="#BFD7E8" opacity=".85"/></g>
    <path d="M380 470h234" stroke="#E3EBE7" stroke-width="3"/>

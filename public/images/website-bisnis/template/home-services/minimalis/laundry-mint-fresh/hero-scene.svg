  <g transform="translate(704 268)">
    <path d="M10 70h196l-16 150a16 16 0 0 1-16 14H42a16 16 0 0 1-16-14z" fill="url(#wk)"/>
    <g stroke="#B58C5C" stroke-width="3" fill="none" stroke-linecap="round"><path d="M16 96h184M20 124h176M24 152h168M28 180h160M32 206h152"/><path d="M52 74l8 158M96 74l2 160M140 74l-2 160M184 74l-8 158" stroke-opacity=".5"/></g>
    <rect x="2" y="58" width="212" height="20" rx="10" fill="#E9CFA8" stroke="#B58C5C" stroke-width="3"/>

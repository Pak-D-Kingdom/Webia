<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="FreshBot, asisten AI FreshWash" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bot{transform-origin:60px 112px;animation:tilt 4.400s ease-in-out infinite}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
    .ant{animation:glow 1.800s ease-in-out infinite}
    .smile{transform-box:fill-box;transform-origin:center;animation:smile 5s ease-in-out infinite}
    @keyframes tilt{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-1.500px)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
    @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes smile{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.12)}}
    @media (prefers-reduced-motion:reduce){.bot,.eye,.ant,.smile{animation:none}}
  </style>
  <defs>
    <radialGradient id="hd" cx=".38" cy=".28" r=".85"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#F1F6F3"/><stop offset="1" stop-color="#D5E3DB"/></radialGradient>
    <linearGradient id="vs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26302F"/><stop offset="1" stop-color="#050707"/></linearGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B9D8BF"/><stop offset="1" stop-color="#8DBB98"/></linearGradient>
    <radialGradient id="an" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#F2FFF8"/><stop offset="1" stop-color="#8DD9B0"/></radialGradient>
  </defs>
  <g class="bot">
    <!-- badan -->
    <path d="M30 120c0-16 12-26 30-26s30 10 30 26z" fill="url(#hd)"/>
    <path d="M44 99c4 4 28 4 32 0v6c-6 5-26 5-32 0z" fill="url(#sg)"/>
    <circle cx="60" cy="113" r="6" fill="#E8F1EB" stroke="#CFE0D5" stroke-width="1.500"/>
    <!-- antena + daun -->
    <path d="M60 26V15" stroke="#9CBFA6" stroke-width="3" stroke-linecap="round"/>
    <circle class="ant" cx="60" cy="12" r="5.500" fill="url(#an)"/>
    <path d="M65 13c5-5 11-4 13 0-4 4-10 4-13 0z" fill="#8DBB98"/>
    <!-- cap hijau -->
    <path d="M36 34c4-9 14-13 24-13s20 4 24 13c-8-3-16-4-24-4s-16 1-24 4z" fill="url(#sg)"/>
    <!-- kepala -->
    <ellipse cx="60" cy="58" rx="42" ry="36" fill="url(#hd)" stroke="#D2E1D8" stroke-width="1.500"/>
    <!-- telinga sage -->
    <ellipse cx="17" cy="58" rx="7" ry="13" fill="url(#sg)"/><ellipse cx="103" cy="58" rx="7" ry="13" fill="url(#sg)"/>
    <ellipse cx="16" cy="58" rx="3.500" ry="7" fill="#E6F1E8" opacity=".7"/><ellipse cx="104" cy="58" rx="3.500" ry="7" fill="#E6F1E8" opacity=".7"/>
    <!-- visor -->
    <rect x="22" y="40" width="76" height="40" rx="19" fill="#EAD9B8"/>
    <rect x="24.500" y="42.500" width="71" height="35" rx="17.500" fill="url(#vs)"/>
    <path d="M32 47c10-4 24-4 34-2" stroke="#fff" stroke-opacity=".18" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- mata cyan (∩ ∩) & senyum putih -->
    <path class="eye" d="M39 62v-3a5.500 5.500 0 0 1 11 0v3" fill="none" stroke="#5FE3F0" stroke-width="3.200" stroke-linecap="round"/>
    <path class="eye" d="M70 62v-3a5.500 5.500 0 0 1 11 0v3" fill="none" stroke="#5FE3F0" stroke-width="3.200" stroke-linecap="round"/>
    <path class="smile" d="M52 67c2.500 4.500 13.500 4.500 16 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="33" cy="69" r="3" fill="#FFA7B5" opacity=".55"/><circle cx="87" cy="69" r="3" fill="#FFA7B5" opacity=".55"/>
  </g>
</svg>

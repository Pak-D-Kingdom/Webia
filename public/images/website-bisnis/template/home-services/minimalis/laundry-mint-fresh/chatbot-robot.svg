<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="FreshBot, asisten AI FreshWash" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bot{transform-origin:60px 100px;animation:tilt 4.200s ease-in-out infinite}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.800s infinite}
    .eye.r{animation-delay:.04s}
    .ant{animation:glow 1.800s ease-in-out infinite}
    .hand{transform-box:fill-box;transform-origin:20% 90%;animation:wave 2.600s ease-in-out infinite}
    .bub{animation:rise 3.200s ease-in infinite;opacity:0}
    .bub.b2{animation-delay:1.100s}.bub.b3{animation-delay:2.100s}
    @keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-22deg)}80%{transform:rotate(8deg)}90%{transform:rotate(-18deg)}}
    @keyframes rise{0%{transform:translateY(8px);opacity:0}20%{opacity:.9}100%{transform:translateY(-14px);opacity:0}}
    @media (prefers-reduced-motion:reduce){.bot,.eye,.ant,.hand,.bub{animation:none}.bub{opacity:.7}}
  </style>
  <defs>
    <linearGradient id="hd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCEEE4"/></linearGradient>
    <linearGradient id="vs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A4A47"/><stop offset="1" stop-color="#16312F"/></linearGradient>
    <radialGradient id="an" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#E9FFF4"/><stop offset="1" stop-color="#5FD1A0"/></radialGradient>
  </defs>
  <g class="bub"><circle cx="20" cy="40" r="5" fill="#fff" fill-opacity=".7" stroke="#A9D8C0"/></g>
  <g class="bub b2"><circle cx="102" cy="52" r="4" fill="#fff" fill-opacity=".7" stroke="#A9D8C0"/></g>
  <g class="bub b3"><circle cx="96" cy="30" r="3" fill="#fff" fill-opacity=".7" stroke="#A9D8C0"/></g>
  <g class="bot">
    <!-- badan -->
    <path d="M36 104c0-12 10-20 24-20s24 8 24 20v6H36z" fill="url(#hd)" stroke="#BCD9CA" stroke-width="2"/>
    <rect x="52" y="92" width="16" height="8" rx="4" fill="#6DB894"/>
    <!-- tangan melambai -->
    <g class="hand"><rect x="84" y="82" width="10" height="20" rx="5" fill="url(#hd)" stroke="#BCD9CA" stroke-width="2" transform="rotate(-18 89 92)"/></g>
    <!-- antena -->
    <path d="M60 24V14" stroke="#9CC7B2" stroke-width="3" stroke-linecap="round"/>
    <circle class="ant" cx="60" cy="11" r="6" fill="url(#an)"/>
    <!-- telinga -->
    <rect x="12" y="46" width="10" height="20" rx="5" fill="#6DB894"/>
    <rect x="98" y="46" width="10" height="20" rx="5" fill="#6DB894"/>
    <!-- kepala -->
    <rect x="18" y="24" width="84" height="66" rx="30" fill="url(#hd)" stroke="#BCD9CA" stroke-width="2"/>
    <rect x="27" y="35" width="66" height="44" rx="22" fill="url(#vs)"/>
    <path d="M36 42c8-4 20-5 30-3" stroke="#fff" stroke-opacity=".25" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- mata & senyum -->
    <ellipse class="eye" cx="46" cy="56" rx="5.500" ry="6.500" fill="#7DF0BE"/>
    <ellipse class="eye r" cx="74" cy="56" rx="5.500" ry="6.500" fill="#7DF0BE"/>
    <path d="M51 67c3.500 4.500 14.500 4.500 18 0" stroke="#7DF0BE" stroke-width="3.200" stroke-linecap="round" fill="none"/>
    <circle cx="38" cy="66" r="3" fill="#FF9DB0" fill-opacity=".55"/><circle cx="82" cy="66" r="3" fill="#FF9DB0" fill-opacity=".55"/>
  </g>
</svg>

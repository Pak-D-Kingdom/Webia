<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" role="img" aria-label="Robot FreshBot di dalam keranjang laundry" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="hd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#DCEEE4"/></linearGradient>
    <linearGradient id="vs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A4A47"/><stop offset="1" stop-color="#16312F"/></linearGradient>
    <radialGradient id="bb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".6" stop-color="#CFEFF2" stop-opacity=".5"/><stop offset="1" stop-color="#9ED8DF" stop-opacity=".55"/></radialGradient>
    <linearGradient id="wk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7CBA3"/><stop offset="1" stop-color="#CFA878"/></linearGradient>
  </defs>
  <style>
    .rb{transform-origin:150px 150px;animation:bob 3.600s ease-in-out infinite}
    .ey{transform-box:fill-box;transform-origin:center;animation:bl 4.600s infinite}
    .bu{animation:fl 5s ease-in-out infinite}.bu.d{animation-delay:1.500s}.bu.e{animation-delay:2.800s}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @media (prefers-reduced-motion:reduce){.rb,.ey,.bu{animation:none}}
  </style>
  <!-- gelembung -->
  <g class="bu"><circle cx="46" cy="52" r="22" fill="url(#bb)" stroke="#BFE3E8"/><ellipse cx="38" cy="43" rx="6" ry="3.500" fill="#fff" opacity=".9" transform="rotate(-35 38 43)"/></g>
  <g class="bu d"><circle cx="258" cy="40" r="16" fill="url(#bb)" stroke="#BFE3E8"/><ellipse cx="252" cy="34" rx="4.500" ry="2.600" fill="#fff" opacity=".9" transform="rotate(-35 252 34)"/></g>
  <g class="bu e"><circle cx="232" cy="92" r="9" fill="url(#bb)" stroke="#BFE3E8"/></g>
  <g class="bu d"><circle cx="74" cy="104" r="8" fill="url(#bb)" stroke="#BFE3E8"/></g>
  <!-- speech card -->
  <g transform="rotate(8 232 70)">
    <rect x="200" y="58" width="62" height="42" rx="10" fill="#fff" stroke="#CFE4D8" stroke-width="2"/>
    <path d="M208 100l-8 12 18-8z" fill="#fff" stroke="#CFE4D8" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="218" cy="79" r="3.500" fill="#6DB894"/><circle cx="231" cy="79" r="3.500" fill="#6DB894"/><circle cx="244" cy="79" r="3.500" fill="#6DB894"/>
  </g>
  <!-- robot -->
  <g class="rb">
    <path d="M126 150c0-14 10-22 24-22s24 8 24 22v8h-48z" fill="url(#hd)" stroke="#BCD9CA" stroke-width="2"/>
    <rect x="142" y="140" width="16" height="8" rx="4" fill="#6DB894"/>
    <rect x="176" y="118" width="10" height="26" rx="5" fill="url(#hd)" stroke="#BCD9CA" stroke-width="2" transform="rotate(32 181 131)"/>
    <rect x="114" y="118" width="10" height="26" rx="5" fill="url(#hd)" stroke="#BCD9CA" stroke-width="2" transform="rotate(-32 119 131)"/>
    <path d="M150 62V50" stroke="#9CC7B2" stroke-width="3" stroke-linecap="round"/><circle cx="150" cy="46" r="6" fill="#7DF0BE"/>
    <rect x="104" y="60" width="92" height="72" rx="32" fill="url(#hd)" stroke="#BCD9CA" stroke-width="2"/>
    <rect x="100" y="84" width="8" height="22" rx="4" fill="#6DB894"/><rect x="192" y="84" width="8" height="22" rx="4" fill="#6DB894"/>
    <rect x="114" y="71" width="72" height="48" rx="24" fill="url(#vs)"/>
    <ellipse class="ey" cx="135" cy="91" rx="6" ry="7" fill="#7DF0BE"/><ellipse class="ey" cx="165" cy="91" rx="6" ry="7" fill="#7DF0BE"/>
    <path d="M140 103c4 5 16 5 20 0" stroke="#7DF0BE" stroke-width="3.400" stroke-linecap="round" fill="none"/>
    <circle cx="124" cy="102" r="3.200" fill="#FF9DB0" fill-opacity=".5"/><circle cx="176" cy="102" r="3.200" fill="#FF9DB0" fill-opacity=".5"/>
  </g>
  <!-- keranjang -->
  <ellipse cx="150" cy="210" rx="104" ry="8" fill="#2F7358" opacity=".14"/>
  <path d="M60 142h180l-14 62a10 10 0 0 1-10 8H84a10 10 0 0 1-10-8z" fill="url(#wk)"/>
  <g stroke="#B58C5C" stroke-width="2" fill="none" stroke-linecap="round"><path d="M68 160h164M72 178h156M78 196h144"/><path d="M110 144l6 66M150 144v68M190 144l-6 66M82 146l10 62M218 146l-10 62" stroke-opacity=".6"/></g>
  <rect x="54" y="134" width="192" height="14" rx="7" fill="#E7CBA3" stroke="#B58C5C" stroke-width="2"/>
  <!-- kain -->
  <path d="M70 136c14-10 30-10 44 0z" fill="#BFD7E8"/><path d="M184 136c14-10 32-10 46 0z" fill="#fff" stroke="#DCEBE2"/>
  <!-- daun -->
  <path d="M30 190c-2-18 8-30 24-34 4 16-6 30-24 34z" fill="#A9D8C0"/><path d="M272 196c2-14-6-26-20-30-2 14 6 26 20 30z" fill="#8FC7AB"/>
</svg>

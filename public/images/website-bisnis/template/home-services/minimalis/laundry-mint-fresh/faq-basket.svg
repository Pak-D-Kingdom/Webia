<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" role="img" aria-label="Keranjang laundry, sabun, dan maskot tetes air" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7CBA3"/><stop offset="1" stop-color="#CFA878"/></linearGradient>
    <linearGradient id="bt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CFEBDD"/><stop offset=".5" stop-color="#F4FBF7"/><stop offset="1" stop-color="#B9DFCB"/></linearGradient>
    <linearGradient id="dp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9EDCF2"/><stop offset="1" stop-color="#5BB9E0"/></linearGradient>
    <radialGradient id="bb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#A9DCE4" stop-opacity=".5"/></radialGradient>

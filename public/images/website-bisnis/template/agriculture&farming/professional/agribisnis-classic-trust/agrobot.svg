<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="AgroBot">
  <style>
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
    .sprout{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.4s ease-in-out infinite}
    .arm{transform-box:fill-box;transform-origin:50% 0;animation:wave 3.2s ease-in-out infinite}
    .glow{animation:glow 2.6s ease-in-out infinite}
    @keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
    @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
    @keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
    @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dce5e1"/></linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a9aa0"/><stop offset="1" stop-color="#1d5f66"/></linearGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f9a4f"/><stop offset="1" stop-color="#2a6a35"/></linearGradient>
    <radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#0d1f1a" stop-opacity=".28"/><stop offset="1" stop-color="#0d1f1a" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="100" cy="226" rx="52" ry="8" fill="url(#sh)"/>
  <!-- sprout -->
  <g class="sprout">
    <path d="M100 36c-2-10 2-18 10-24" fill="none" stroke="#3f7d3a" stroke-width="3" stroke-linecap="round"/>
    <path d="M108 14c8-8 22-8 30-2-6 10-18 13-30 2z" fill="#5fa24a"/>
    <path d="M106 18c-3-9-12-13-22-10 1 10 9 15 22 10z" fill="#3f8a3f"/>
    <path d="M112 12c8-1 20 0 26 0" fill="none" stroke="#2c6a30" stroke-width="1" opacity=".6"/>
  </g>
  <!-- headband -->
  <path d="M42 78C40 40 70 30 100 30s60 10 58 48" fill="none" stroke="#1d5f66" stroke-width="5" stroke-linecap="round"/>
  <!-- head -->
  <rect x="42" y="42" width="116" height="92" rx="44" fill="url(#body)" stroke="#c9d6d1" stroke-width="1.5"/>
  <rect x="54" y="56" width="92" height="56" rx="26" fill="#0b161a"/>
  <rect x="58" y="59" width="84" height="14" rx="7" fill="#ffffff" opacity=".07"/>
  <g class="glow" fill="none" stroke="#35e0ef" stroke-width="5" stroke-linecap="round">
    <ellipse class="eye" cx="80" cy="82" rx="7" ry="9"/>
    <ellipse class="eye" cx="120" cy="82" rx="7" ry="9"/>
    <path d="M91 100c5 4 13 4 18 0" stroke-width="3.5"/>
  </g>
  <!-- ear cups -->
  <circle cx="40" cy="88" r="13" fill="url(#cup)"/><circle cx="40" cy="88" r="6" fill="#0f3f45"/>
  <circle cx="160" cy="88" r="13" fill="url(#cup)"/><circle cx="160" cy="88" r="6" fill="#0f3f45"/>
  <path d="M158 100c0 8-6 14-16 14" fill="none" stroke="#1d5f66" stroke-width="3" stroke-linecap="round"/>
  <!-- neck + body -->
  <rect x="88" y="130" width="24" height="12" rx="4" fill="#17262a"/>
  <rect x="56" y="138" width="88" height="68" rx="30" fill="url(#body)" stroke="#c9d6d1" stroke-width="1.5"/>
  <path d="M100 152c10 3 14 11 12 20-10-1-16-8-12-20z" fill="#b5c732"/>
  <path d="M100 153c3 7 6 12 11 17" fill="none" stroke="#6d7d16" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M62 190c4 10 14 14 24 14" fill="none" stroke="#2f6a3a" stroke-width="9" stroke-linecap="round" opacity=".85"/>
  <!-- left arm with plant -->
  <g class="arm">
    <rect x="34" y="146" width="20" height="46" rx="10" fill="url(#body)" stroke="#c9d6d1" stroke-width="1.3"/>
    <circle cx="44" cy="194" r="9" fill="#17262a"/>
    <path d="M44 192c-6-12-4-22 2-30" fill="none" stroke="#3f7d3a" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M46 164c8-3 14 0 17 6-8 4-15 2-17-6z" fill="#5fa24a"/>
    <path d="M44 176c-9-3-15 0-17 6 8 4 15 2 17-6z" fill="#3f8a3f"/>
  </g>
  <!-- right arm with tablet -->
  <g>
    <rect x="146" y="146" width="20" height="40" rx="10" fill="url(#body)" stroke="#c9d6d1" stroke-width="1.3"/>
    <g transform="rotate(-12 150 184)">
      <rect x="128" y="168" width="50" height="34" rx="5" fill="url(#tab)" stroke="#1e5428" stroke-width="2"/>
      <rect x="132" y="172" width="42" height="26" rx="3" fill="#7bbd6a" opacity=".55"/>
      <path d="M140 190c4-8 12-12 22-12-1 9-8 14-22 12z" fill="#e8f5df" opacity=".9"/>
    </g>
    <circle cx="156" cy="190" r="8" fill="#17262a"/>
  </g>
  <!-- feet -->
  <rect x="72" y="204" width="22" height="14" rx="7" fill="#17262a"/>
  <rect x="106" y="204" width="22" height="14" rx="7" fill="#17262a"/>
</svg>
